<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product list with cart</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles2.css" />
  </head>

  <body>
    <div class="container my-5">
      <div class="row g-1">
        <div class="col-lg-8">
          <h1 class="mb-4">Desserts</h1>
          <div class="row g-2" id="container"></div>
        </div>

        <div class="col-lg-4">
          <div class="card p-3 cart-box">
            <h6 class="mb-3">Your Cart (<span id="cartQty">0</span>)</h6>
            <div id="cart-container"></div>
            <div
              class="d-flex justify-content-between align-items-center fw-bold my-3"
            >
              <span class="text-muted">Order Total</span>
              <span id="totalPrice">$46.50</span>
            </div>
            <div class="carbon-box">
              <img src="./assets/images/icon-carbon-neutral.svg" alt="" />
              <span> This is a <b>carbon-neutral</b> delivery </span>
            </div>

            <button class="btn confirm-btn mt-3">Confirm Order</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
          <img
            src="./assets/images/icon-order-confirmed.svg"
            width="40"
            class="mb-3"
          />
          <h5 class="fw-bold">Order Confirmed</h5>
          <p class="text-muted">We hope you enjoy your food!</p>
          <div id="confirm-items" class="border rounded p-3 mb-3"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app2.js"></script>
  </body>
</html>
